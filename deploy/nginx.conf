# Ploi → Manage Site → Nginx Configuration.
# INLOCUIESTE TOT ce e acolo cu fisierul asta, apoi Save.
#
# Ce era inainte: sablonul PHP al lui Ploi. Pentru un site static, trei linii din
# el faceau rau concret:
#
#   try_files $uri $uri/ /index.php?$query_string   → /blog cadea pe `$uri/`, adica
#     un redirect 301 catre /blog/, desi sitemap.xml si canonical-ul spun /blog
#   error_page 404 /index.php                       → index.php nu exista, deci
#     404-ul frumos din dist/404.html nu se vedea niciodata
#   location ~ \.php$ ... fastcgi_pass              → orice fisier .php ajuns in
#     dist/ ar fi fost EXECUTAT. Pe un site fara nicio linie de PHP, e doar
#     suprafata de atac degeaba.
#
# Si lipsea cu totul `Cache-Control`. Fara el, browserul pastreaza un index.html
# vechi, care cere un bundle JS ce nu mai exista dupa deploy. Cererea da 404 si
# pagina ramane fara JavaScript — iar pentru ca paginile sunt prerandate, arata
# intreaga, dar nimic nu mai raspunde. Exact ce ti s-a intamplat cu meniul.
#
# Dupa Save, Ploi ruleaza `nginx -t`. Daca da eroare, NU s-a aplicat nimic si
# configul vechi ramane activ — citeste mesajul inainte sa pleci din pagina.
#
# Verificare de afara, fara SSH:
#   curl -sI https://oops404.ro/ | grep -i cache-control     → no-cache
#   curl -sI https://oops404.ro/blog | head -1               → 200, nu 301

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/oops404.ro/before/*;

server {
    #listen 80;
    #listen [::]:80;

    root /home/ploi/oops404.ro/dist;
    server_name oops404.ro;

    include /etc/nginx/ssl/oops404.ro;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

    # fara index.php: nu exista PHP in proiect
    index index.html;

    # Anteturile NU se pun in `location`: nginx nu mosteneste `add_header` intr-un
    # bloc care isi defineste propriile anteturi, deci ar disparea de peste tot
    # altundeva. De aceea politica de cache se face mai jos cu `expires`, care e
    # alta directiva si nu rupe mostenirea.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    charset utf-8;

    # Ploi Configuration, do not remove!
    include /etc/nginx/ploi/oops404.ro/server/*;

    # ── Paginile ────────────────────────────────────────────────────────────
    # Fiecare ruta are propriul fisier, scris la build de scripts/prerender.mjs:
    #   /blog → dist/blog/index.html,  /termeni → dist/termeni/index.html
    #
    # `$uri/index.html` direct, nu `$uri/`: acela ar trimite un 301 de la /blog la
    # /blog/. `=404` in loc de fallback: altfel fiecare adresa gresita ar primi
    # pagina principala cu cod 200, iar Google ar indexa-o de zece ori.
    # `expires -1` = Cache-Control: no-cache — HTML-ul se revalideaza mereu.

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/index.html =404;
        expires -1;
    }

    # ── Fisierele care nu se schimba ────────────────────────────────────────
    # Numele contine hash-ul continutului, deci pot sta in cache la nesfarsit.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    location /fonts/ {
        expires 30d;
        access_log off;
    }

    location ~* \.(webp|png|jpe?g|svg|ico)$ {
        expires 7d;
        access_log off;
    }

    location = /sitemap.xml { expires 1h; }
    location = /rss.xml     { expires 1h; }
    location = /robots.txt  { try_files $uri =404; access_log off; log_not_found off; }
    location = /favicon.ico { access_log off; log_not_found off; }

    # ── 404 ─────────────────────────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }

    # fisierele ascunse raman inchise, mai putin .well-known (certificatele)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log off;
    error_log  /var/log/nginx/oops404.ro-error.log error;
}

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/oops404.ro/after/*;
