# Configurarea nginx pentru oops404.ro (Ploi → Manage Site → Nginx Configuration).
#
# Partea care contează e `try_files`. Site-ul NU mai e un SPA cu un singur index.html:
# fiecare rută are propriul fișier, generat la build de `scripts/prerender.mjs`:
#
#   /                      → dist/index.html
#   /blog                  → dist/blog/index.html
#   /blog/<articol>        → dist/blog/<articol>/index.html
#   /termeni               → dist/termeni/index.html
#
# Un `try_files $uri /index.html` clasic de SPA ar servi pagina principală pentru
# TOATE adresele. Site-ul ar părea să meargă (React ar desena ruta corectă după
# încărcare), dar Google ar primi pagina principală pentru fiecare articol, iar
# hidratarea ar porni de la HTML greșit. De aceea `$uri/` vine înainte de fallback.

root /home/ploi/oops404.ro/dist;
index index.html;

location / {
    try_files $uri $uri/ =404;
}

# Adresele inexistente primesc pagina 404 cu codul 404 — nu 200 cu pagina principală.
error_page 404 /404.html;
location = /404.html {
    internal;
}

# Fișierele cu hash în nume nu se schimbă niciodată sub același nume: pot fi ținute la infinit.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Imaginile și fonturile din public/ au nume stabile: o săptămână, ca să se poată înlocui.
location ~* \.(webp|png|jpe?g|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

# HTML-ul nu se ține în cache: altfel un articol nou n-ar apărea până la expirare.
location ~* \.html$ {
    add_header Cache-Control "no-cache";
}

location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
location = /rss.xml     { add_header Cache-Control "public, max-age=3600"; }

# Câteva anteturi de securitate. Nu costă nimic și se văd în orice audit.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
