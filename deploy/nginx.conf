# Configurarea nginx pentru oops404.ro (Ploi → Manage Site → Nginx Configuration).
#
# Doua lucruri se rezolva aici si nicaieri altundeva:
#
# 1. RUTAREA. Site-ul nu mai e un SPA cu un singur index.html: fiecare ruta are
#    propriul fisier, scris la build de `scripts/prerender.mjs`:
#
#      /                → dist/index.html
#      /blog            → dist/blog/index.html
#      /blog/<articol>  → dist/blog/<articol>/index.html
#      /termeni         → dist/termeni/index.html
#
#    Un `try_files ... /index.html` clasic de SPA ar servi pagina principala
#    pentru TOATE adresele, iar Google ar indexa pagina principala in locul
#    fiecarui articol.
#
# 2. CACHE-UL. Asta e partea care chiar strica site-ul daca lipseste.
#    HTML-ul trebuie revalidat la fiecare cerere. Altfel browserul pastreaza un
#    index.html vechi, care trimite catre un bundle JS din alt build; fisierul
#    ala nu mai exista pe server, cererea da 404 si pagina ramane FARA JavaScript.
#    Iar pentru ca paginile sunt prerandate, pagina arata perfect intreaga — doar
#    ca nimic nu mai e interactiv: meniul nu raspunde, case study-ul nu se
#    deschide, bannerul nu apare. Exact simptomele unui "nu mai merge nimic".
#
# NOTA DESPRE ANTETURI: nginx NU mosteneste `add_header` intr-un bloc care isi
# defineste propriile `add_header`. De aceea politica de cache se pune cu
# `expires` (alta directiva, nu rupe mostenirea), iar `add_header` apare o
# singura data, aici sus.

root /home/ploi/oops404.ro/dist;
index index.html;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Pagina principala. Bloc separat pentru ca `$uri/index.html` nu se rezolva
# curat cand $uri e chiar "/".
location = / {
    try_files /index.html =404;
    expires -1;
}

# Restul paginilor. `$uri/index.html` direct, fara `$uri/`: acela ar trimite un
# redirect 301 de la /blog la /blog/, iar sitemap.xml si canonical-ul din pagina
# spun /blog, fara slash — Google ar raporta fiecare adresa din sitemap drept
# "pagina cu redirectionare".
location / {
    try_files $uri $uri/index.html =404;
    expires -1;
}

# Fisierele cu hash in nume nu se schimba niciodata sub acelasi nume.
location /assets/ {
    expires 1y;
    access_log off;
}

# Fonturile stau in public/fonts/ si se schimba doar cand le readucem.
location /fonts/ {
    expires 30d;
    access_log off;
}

# Imaginile au nume stabile: o saptamana, ca sa se poata inlocui fara sa astepti.
location ~* \.(webp|png|jpe?g|svg|ico)$ {
    expires 7d;
    access_log off;
}

location = /sitemap.xml { expires 1h; }
location = /rss.xml     { expires 1h; }

# Adresele inexistente primesc pagina 404 cu codul 404, nu 200 cu pagina principala.
error_page 404 /404.html;
location = /404.html {
    internal;
    expires -1;
}
